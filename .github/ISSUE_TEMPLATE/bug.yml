name: Bug report
description: Report unexpected behavior in the compiler, runtime, preview, or editor.
labels: [bug, triage]
body:
  - type: input
    id: version
    attributes:
      label: Elnor version or commit
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Compiler, Runtime, Preview, Editor, Other]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the OS, Node.js version, and browser or editor version.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include a minimal public or synthetic example and the commands required to reproduce it.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the exact diagnostic if applicable. Remove credentials, private paths, and personal data.
    validations:
      required: true
