name: Performance regression
description: Report a reproducible increase in time, memory, or generated size.
labels: [performance, triage]
body:
  - type: input
    id: revisions
    attributes:
      label: Baseline and affected versions or commits
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include OS, CPU, Node.js version, and browser version when relevant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Workload and commands
      description: Share a minimal synthetic workload and the commands used.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Measurements
      description: Include units, sample count, and before-and-after results.
    validations:
      required: true
